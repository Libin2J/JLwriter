[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jlwriter"
version = "0.1.0"
description = "一款内置 GraphRAG 与多 Agent 协作的 AI 小说写作助手"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }          # 与你的 LICENSE 保持一致
authors = [
    { name = "李斌", email = "1044147744@qq.com" }
]
keywords = ["novel", "writing", "ai", "pyqt5", "graphrag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
]

dependencies = [
    "PyQt5>=5.15.0",
    "openai>=1.0.0",
    "requests>=2.28.0",
    "networkx>=3.0",
    "json-repair>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "twine>=5.0.0",
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.4.0",
]

# 👇 核心：定义命令行入口
[project.scripts]
jlwriter = "jlwriter.main:main"      # 用户安装后，在终端输入 jlwriter 即可启动

[tool.setuptools.packages.find]
where = ["src"]

# 👇 告诉 setuptools 把包内的非 .py 资源文件也打进去
[tool.setuptools.package-data]
jlwriter = ["knowledge/*.md", "ico/*", "presetting.json"]